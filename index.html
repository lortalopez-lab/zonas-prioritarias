<title>Asistente de Zonas Prioritarias</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#5b1028 0%,#7a1738 48%,#4b0b21 100%);color:#182230;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:1000px;margin:auto;min-height:100vh;padding:24px 16px 40px}
header{text-align:center;padding:18px 10px 20px;color:#fff}header h1{font-size:30px;margin:0 0 7px}header p{margin:0;color:#f3dfe6}
.chat{background:#fff;border:1px solid #e8d8df;border-radius:20px;box-shadow:0 14px 40px rgba(45,5,20,.28);overflow:hidden}
.messages{height:58vh;min-height:430px;overflow:auto;padding:24px}
.msg{display:flex;margin-bottom:16px}.msg.user{justify-content:flex-end}.bubble{max-width:84%;padding:14px 17px;border-radius:17px;line-height:1.55;font-size:15px}

.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#e8f7ee;color:#16733c;font-weight:800;font-size:12px;margin-bottom:8px}.badge.no{background:#fff0f0;color:#b42318}
.composer{border-top:1px solid #e7eaf0;padding:14px;display:flex;gap:10px}.composer input{flex:1;padding:14px 16px;border:1px solid #cbd3df;border-radius:13px;font-size:16px;outline:none}.composer input:focus{border-color:#3157c8}
.send{border:0;border-radius:13px;background:#3157c8;color:white;font-weight:800;padding:0 20px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid #e9edf3}th{color:#667085}
.note{font-size:12px;color:#667085;text-align:center;margin-top:12px}
@media(max-width:650px){header h1{font-size:24px}.messages{height:60vh;padding:16px}.bubble{max-width:94%}.send{padding:0 14px}}
</style>
</head>

function norm(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function add(html,who='bot'){const d=document.createElement('div');d.className='msg '+who;d.innerHTML='<div class="bubble">'+html+'</div>';document.getElementById('messages').appendChild(d);const box=document.getElementById('messages');box.scrollTop=box.scrollHeight}
function send(){const x=document.getElementById('input').value.trim();if(x)ask(x)}
function ask(q){
 document.getElementById('input').value='';
 // Cada nueva consulta inicia una conversación limpia:
 // elimina automáticamente la pregunta y respuesta anteriores.
 document.getElementById('messages').innerHTML='';
 add(esc(q),'user');
 setTimeout(()=>answer(q),50);
}

function words(s){return norm(s).split(/\s+/).filter(x=>x.length>2)}
function similarity(a,b){
 const A=new Set(words(a)), B=new Set(words(b)); if(!A.size||!B.size)return 0;
 let n=0; for(const x of A)if(B.has(x))n++;
 return n/Math.max(A.size,B.size);
}

function answer(raw){
 const q=norm(raw);

 // 1) Consultas de sección
 const m=q.match(/\b(?:seccion|sección)\s*(?:electoral\s*)?(\d{3,5})\b/) || q.match(/\b(\d{3,5})\b/);
 if(m){
   const sec=m[1], found=DATA.filter(r=>norm(r.seccion)===sec);
   if(found.length)return sectionAnswer(sec,found);
   return add('<span class="badge no">NO APARECE</span><br><b>La sección '+esc(sec)+' no aparece registrada como prioritaria.</b><br><br>La sección consultada no figura en el archivo de referencia.');
 }

 // 2) Primero buscar coincidencias exactas o contenidas del nombre de colonia.
 const qClean=q.replace(/[¿?]/g,'');
 let found=DATA.filter(r=>{
   const c=norm(r.colonia);
   return c && (qClean===c || qClean.includes(c) || c.includes(qClean));
 });

 // 3) Si no hay coincidencia, identificar la parte probable del nombre y comparar por palabras.
 if(!found.length){
   const stop=new Set(['es','son','la','el','los','las','una','un','colonia','colonia?','prioritaria','prioritario','prioridad','aparece','registrada','registrado','como','de','del','que','qué','dime','cual','cuál','en','hay','existe','esta','está','seria','sería','si','no','por','favor']);
   const tokens=words(qClean).filter(x=>!stop.has(x));
   if(tokens.length){
     found=DATA.filter(r=>{
       const c=norm(r.colonia);
       return tokens.every(t=>c.includes(t));
     });
   }
 }

 if(found.length)return colonyAnswer(found);

 // 4) Sugerencias por similitud para evitar falsos "no".
 const candidates=[];
 for(const r of DATA){
   const s=similarity(qClean,r.colonia);
   if(s>=0.5)candidates.push({r,s});
 }
 candidates.sort((a,b)=>b.s-a.s);
 const suggestions=[...new Set(candidates.slice(0,5).map(x=>x.r.colonia))];

 let extra=suggestions.length
 ? '<br><br><b>¿Quizá quisiste decir?</b><br>'+suggestions.map(x=>'• '+esc(x)).join('<br>')
 : '';
 add('<span class="badge no">NO APARECE</span><br><b>No aparece como prioritaria.</b><br><br>La colonia consultada no coincide con un registro de la base de datos.'+extra);
}

function colonyAnswer(found){
 const names=[...new Set(found.map(r=>r.colonia))];
 const secs=[...new Set(found.map(r=>r.seccion))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
 const title=names.length===1?names[0]:names.join(' / ');
 add('<span class="badge">SÍ, ES PRIORITARIA</span><br><b>Sí, la colonia '+esc(title)+' es prioritaria.</b><br><br>'+
 'Aparece registrada en <b>'+secs.length+'</b> sección(es) electoral(es):<br><br>'+
 secs.map(s=>'<b>'+esc(s)+'</b>').join(' · ')+
 '<table><thead><tr><th>Colonia</th><th>Sección</th><th>Tipo de zona</th><th>Tipo de asentamiento</th><th>Código postal</th></tr></thead><tbody>'+
 found.map(r=>'<tr><td>'+esc(r.colonia)+'</td><td>'+esc(r.seccion)+'</td><td>'+esc(r.tipo_zona)+'</td><td>'+esc(r.tipo_asentamiento)+'</td><td>'+esc(r.cp)+'</td></tr>').join('')+
 '</tbody></table>');
}
function sectionAnswer(sec,found){
 add('<span class="badge">SÍ, ES PRIORITARIA</span><br><b>Sí, la sección '+esc(sec)+' es prioritaria.</b><br><br>'+
 'La base contiene <b>'+found.length+'</b> registro(s) para esta sección.'+
 '<table><thead><tr><th>Colonia</th><th>Tipo de zona</th><th>Tipo de asentamiento</th><th>CP</th></tr></thead><tbody>'+
 found.map(r=>'<tr><td>'+esc(r.colonia)+'</td><td>'+esc(r.tipo_zona)+'</td><td>'+esc(r.tipo_asentamiento)+'</td><td>'+esc(r.cp)+'</td></tr>').join('')+
 '</tbody></table>');
}
add('<b>Hola.</b> Puedo consultar las colonias y secciones prioritarias.');
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
